<!DOCTYPE html>
<html>

<head>

  <meta charset = "utf-8">
  <title>Calendar Viewer</title>
  <script src = "https://cdn.jsdelivr.net/npm/fullcalendar@6.1.8/index.global.min.js"></script>

  <style>
    body { font-family: Arial; padding: 20px; }
    #calendar { max-width: 900px; margin: auto; }
  </style>

</head>

<body>

  <h2>Event Calendar</h2>
  <div id="calendar"></div>

  <script>

    document.addEventListener('DOMContentLoaded', function() {
        const calendarEl = document.getElementById('calendar');
        
        const calendar = new FullCalendar.Calendar(calendarEl, {
            initialView: 'dayGridMonth',

            eventTimeFormat: {
                hour: 'numeric',
                minute: '2-digit',
                meridiem: 'short'
            },

            events: function(fetchInfo, successCallback, failureCallback) {
                
   
                const url = `http://127.0.0.1:8000/api/events/?start=${encodeURIComponent(fetchInfo.startStr)}&end=${encodeURIComponent(fetchInfo.endStr)}`;

                console.log("DEBUG url:", url);

                fetch(url)
                    .then(res => {
                        if ( !res.ok ) throw new Error("API error")
                        return res.json();
                    })
                    .then(data => successCallback(data))
                    .catch(err => failureCallback(err))
            },
            
            eventClick: function(info) {
                alert(
                    "Title: " + info.event.title +
                    "\nLocation: " + info.event.extendedProps.location +
                    "\nType: " + info.event.extendedProps.event_type +
                    "\nStart: " + info.event.start +
                    "\nEnd: " + info.event.end
                );
            }
        });

        calendar.render();
    });
  
  </script>


</body>
</html>
